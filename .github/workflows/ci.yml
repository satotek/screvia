name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Xcode ${{ matrix.xcode }})
    # 26.5 is the minimum the README promises; 27.0 is what development uses.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.5"
            developer-dir: /Applications/Xcode_26.5.0.app/Contents/Developer
          - runner: xcode-27
            xcode: "27.0"
            developer-dir: /Applications/Xcode_27.0.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
      # LicenseList's build plugin looks for Xcode's SourcePackages layout;
      # xcodebuild writes it under the custom DerivedData path BuildApp.swift
      # passes it, so this only matters for the standalone `swift build`/
      # `swift test` steps below, which use the SwiftPM CLI's own .build.
      PLL_SOURCE_PACKAGES_PATH: "${{ github.workspace }}/.build"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: Build ScreviaKit (debug)
        run: swift build

      - name: Test
        run: swift test --parallel

      # Assembling and signing Screvia.app through Xcode is where packaging
      # regressions show up, so exercise it rather than only compiling the
      # library.
      - name: Assemble Screvia.app
        run: swift scripts/BuildApp.swift --no-open

      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 .build/Screvia.app
