name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"
      SIGNING_IDENTITY: "Screvia Code Signing"
      # For `swift test`; BuildApp.swift sets its own. See ci.yml.
      PLL_SOURCE_PACKAGES_PATH: "${{ github.workspace }}/.build"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # BuildApp derives the build number from the commit count.
          fetch-depth: 0

      # CreateDMG names the image after project.yml's MARKETING_VERSION, so a
      # tag that disagrees with it would publish a mislabelled release.
      - name: Check the tag matches the app version
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?$/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Before the slow steps, so a missing changelog section fails at once.
      - name: Write the release notes
        run: |
          swift scripts/ReleaseNotes.swift "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          swift scripts/ReleaseNotes.swift --changes-only "$VERSION" > "$RUNNER_TEMP/update-notes.md"

      - name: Install XcodeGen
        run: brew install xcodegen

      # A tag pushed together with its commit races CI, so a release cannot
      # rely on CI having passed first.
      - name: Test
        run: swift test --parallel

      # The certificate is self-signed rather than Apple-issued, so this needs
      # no Developer Program membership. Its only job is a designated
      # requirement that stays the same across releases, which is what lets
      # an update keep the user's Screen Recording grant.
      - name: Import the signing certificate
        env:
          SIGNING_P12: ${{ secrets.SCREVIA_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SCREVIA_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # The existing search list is split into one argument per keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build the disk image
        run: swift scripts/CreateDMG.swift --sign "$SIGNING_IDENTITY"

      - name: Verify the app
        run: |
          codesign --verify --deep --strict --verbose=2 .build/Screvia.app
          codesign -dr - .build/Screvia.app
          # The About window shows CFBundleShortVersionString, so check the
          # built app rather than trusting project.yml alone.
          plist=.build/Screvia.app/Contents/Info.plist
          shown=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          if [ "$shown" != "$VERSION" ]; then
            echo "::error::the app reports $shown, expected $VERSION"
            exit 1
          fi
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "version $shown, build $build"
          # Sparkle compares build numbers, not versions, to find a newer one.
          echo "BUILD=$build" >> "$GITHUB_ENV"
          # Intel Macs still run macOS 15, the minimum.
          archs=$(lipo -archs .build/Screvia.app/Contents/MacOS/Screvia)
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::the app lacks $arch (has: $archs)"; exit 1 ;;
            esac
          done

      # Installed copies find this release through the appcast, and accept
      # the image only with a signature from the key whose public half is in
      # their Info.plist. The key reaches sign_update on standard input, so it
      # never appears in a command line.
      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::the SPARKLE_ED_PRIVATE_KEY secret is not set"
            exit 1
          fi
          # SwiftPM unpacked Sparkle's tools for the test step.
          sign_update=.build/artifacts/sparkle/Sparkle/bin/sign_update
          dmg="dist/Screvia-$VERSION.dmg"
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - -p "$dmg")
          swift scripts/Appcast.swift "$VERSION" "$BUILD" "$dmg" "$signature" \
            "$RUNNER_TEMP/update-notes.md" > dist/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="dist/Screvia-$VERSION.dmg"
          shasum -a 256 "$dmg" | sed "s|dist/||" > "$dmg.sha256"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" dist/appcast.xml \
            --title "Screvia $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
