# The app shell. Everything but @main lives in the ScreviaKit package, which
# this project embeds as a local dependency — the same split that lets Xcode
# render SwiftUI previews and lets `swift test` run without an app target.
#
# Regenerate with: xcodegen generate
# Screvia.xcodeproj is gitignored; this file is the source of truth.
name: Screvia

options:
  bundleIdPrefix: dev.satotek
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Becomes LastUpgradeCheck. Raise it only together with the settings below,
  # after diffing them against a fresh project from the new Xcode's template.
  xcodeVersion: "27.0"

# What Xcode 27's project template sets and XcodeGen's presets don't.
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    DEAD_CODE_STRIPPING: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true

packages:
  ScreviaKit:
    path: .

targets:
  Screvia:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ScreviaKit
        product: ScreviaKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screvia
        CFBundleName: Screvia
        # Expanded from the build settings below, so the version lives in one
        # place: CreateDMG and the release workflow read MARKETING_VERSION too.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        # Keep the existing .icns rather than introducing an asset catalog:
        # scripts/regrid-appicon.swift already produces it on Apple's grid.
        CFBundleIconFile: AppIcon.icns
        CFBundleLocalizations: [en, ja]
        # A menu bar app: no Dock icon, no main window on launch.
        LSUIElement: true
        # Offers Screvia under Finder's Open With for images, to annotate
        # them. Alternate, so it never takes over as the default app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        NSHumanReadableCopyright: "Copyright © 2026 satotek. MIT License."
        NSScreenCaptureUsageDescription: >-
          Screvia uses Screen Recording access to capture images from your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.satotek.screvia
        MARKETING_VERSION: "0.1.1"
        # Only for builds run from Xcode. BuildApp overrides it with the
        # commit count, which only ever grows along main.
        CURRENT_PROJECT_VERSION: "1"
        # Match ScreviaKit's language mode rather than the template's 5.0.
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: true
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: true
        # Ad-hoc from Xcode. BuildApp signs with a certificate instead when
        # this Mac has one; see docs/build-and-packaging.md#signing.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: true
